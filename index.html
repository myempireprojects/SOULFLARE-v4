const PR={male:{sub:"he",obj:"him",pos:"his"},female:{sub:"she",obj:"her",pos:"her"},other:{sub:"they",obj:"them",pos:"their"}};
function inj(t,p1,p2){
  if(!t)return"";
  const a=PR[p1?.gender]||PR.other,b=PR[p2?.gender]||PR.other;
  return t
    .replace(/{p1}/g,p1?.name||"Partner 1").replace(/{p2}/g,p2?.name||"Partner 2")
    .replace(/{sub1}/g,a.sub).replace(/{obj1}/g,a.obj).replace(/{pos1}/g,a.pos)
    .replace(/{sub2}/g,b.sub).replace(/{obj2}/g,b.obj).replace(/{pos2}/g,b.pos)
    .replace(/{Sub1}/g,a.sub[0].toUpperCase()+a.sub.slice(1))
    .replace(/{Sub2}/g,b.sub[0].toUpperCase()+b.sub.slice(1));
}
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ════════════════════════════════════════
   ADAPTIVE ENGINE
   ════════════════════════════════════════ */
const ENGINE={
  // Weighted random pick
  weightedPick(options,weights){
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    for(let i=0;i<options.length;i++){r-=weights[i];if(r<=0)return options[i];}
    return options[options.length-1];
  },

  // What type of round is this?
  selectRoundType(round,energy,recentTypes,chaosRoundsLeft){
    if(round===0)return"card";
    if(chaosRoundsLeft>0)return"card"; // chaos already active
    const types=["card","card","card","spin","fate","puzzle","chaos"];
    const recency=(t)=>recentTypes.slice(-4).includes(t)?0.2:1;
    const w=[
      55*recency("card"),
      energy>40?18*recency("spin"):5,
      15*recency("fate"),
      18*recency("puzzle"),
      round>3?14:3,
    ];
    return this.weightedPick(["card","spin","fate","puzzle","chaos"],w);
  },

  // Which category of card?
  selectCategory(energy,recentCats,archetype){
    const base={
      fun:10, truth:18, activity:18, vulnerability:12, affection:10,
      revelation:12, trust:12, bible:6,
      spicy: energy>75?22:energy>55?14:energy>35?6:0,
    };
    const bonus=(ARCHETYPES.find(a=>a.id===archetype)||{weights:{}}).weights;
    Object.entries(bonus).forEach(([k,v])=>{if(base[k]!==undefined)base[k]+=v;});
    recentCats.slice(-3).forEach(c=>{if(base[c])base[c]=Math.max(2,base[c]-14);});
    const cats=Object.keys(base).filter(k=>base[k]>0);
    const ws=cats.map(k=>base[k]);
    return this.weightedPick(cats,ws);
  },

  // Pick the actual card
  selectCard(cat,energy,usedIds,branchDepth,chaosEffect){
    const minHot=Math.max(1,Math.floor((energy-20)/12)+branchDepth);
    const maxHot=Math.min(10,Math.ceil(energy/10)+2+branchDepth);
    let pool=CARDS.filter(c=>c.cat===cat&&!usedIds.includes(c.id)&&c.hot>=minHot&&c.hot<=maxHot);
    if(!pool.length)pool=CARDS.filter(c=>c.cat===cat&&!usedIds.includes(c.id));
    if(!pool.length)pool=CARDS.filter(c=>!usedIds.includes(c.id));
    if(!pool.length)pool=CARDS;
    if(chaosEffect==="wild")pool=CARDS.filter(c=>!usedIds.includes(c.id));
    if(chaosEffect==="intensify")pool=pool.filter(c=>c.hot>=7)||pool;
    const wtd=[];
    pool.forEach(c=>{const w=c.rarity==="legendary"?1:c.rarity==="epic"?2:c.rarity==="rare"?5:10;for(let i=0;i<w;i++)wtd.push(c);});
    return wtd[Math.floor(Math.random()*wtd.length)]||pool[0];
  },

  // Should a branch trigger?
  shouldBranch(card,round){return card?.branchable&&round>2&&Math.random()<0.65;},

  // Should chaos fire?
  shouldChaos(round,recentCats,chaosRoundsLeft){
    if(round<4||chaosRoundsLeft>0)return false;
    const boring=recentCats.slice(-4).length===4&&new Set(recentCats.slice(-4)).size<=2;
    return Math.random()<(boring?0.55:0.22);
  },
};

  const [voice,     setVoice]     = useState(true);
  const [timeLeft,  setTimeLeft]  = useState(0);
  const [timerOn,   setTimerOn]   = useState(false);
  /* Chaos */
  const [chaosEv,   setChaosEv]   = useState(null); // current event
  const [chaosLeft, setChaosLeft] = useState(0);    // rounds remaining
  const [showChaos, setShowChaos] = useState(false);
  const [chaosEffect,setChaosEffect]=useState(null);
  /* Branch */
  const [showBranch,setShowBranch]= useState(false);
  const [branchDepth,setBranchDepth]=useState(0);  // -1/0/+1
  /* Secret mission */
  const [mission,   setMission]   = useState(null);
  const [showMission,setShowMission]=useState(false);
  const [missionDone,setMissionDone]=useState(false);
  /* Puzzle */
  const [puzData,   setPuzData]   = useState(null);
  const [puzSel,    setPuzSel]    = useState(null);
  const [puzDone,   setPuzDone]   = useState(false);
  const [puzDouble, setPuzDouble] = useState(false);
  /* Spin */
  const [spinAngle, setSpinAngle] = useState(0);
  const [spinning,  setSpinning]  = useState(false);
  const [spinRes,   setSpinRes]   = useState(null);
  /* Fate */
  const [fateCard,  setFateCard]  = useState(null);
  const [fateFlip,  setFateFlip]  = useState(false);
  const [fateTurn,  setFateTurn]  = useState(0);
  /* Setup */
  const [newName,   setNewName]   = useState("");
  const [newGender, setNewGender] = useState("female");
  const [linkStep,  setLinkStep]  = useState(null);
  const [ageWarned, setAgeWarned] = useState(false);
  /* Continue */
  const [contPrompt,setContPrompt]= useState(false);
  const [contCount, setContCount] = useState(6);
  /* PWA */
  const [canInstall,setCanInstall]= useState(false);
  const [roundType, setRoundType] = useState("card"); // card/spin/fate/puzzle

  const couplesRef = useRef([]);
  const timerRef   = useRef(null);
  const contRef    = useRef(null);
  const pendRef    = useRef(null);
  const installRef = useRef(null);
  const fateDeckRef= useRef([]);
  const fateIdxRef = useRef(0);
  const flameRef   = useRef(50);  // ref for use in closures

  useEffect(()=>{couplesRef.current=couples;},[couples]);
  useEffect(()=>{flameRef.current=flameE;},[flameE]);

  /* ── Loading sequence ── */
  useEffect(()=>{
    if(screen!=="loading")return;
    let p=0;
    const iv=setInterval(()=>{
      p+=Math.random()*18+4;
      if(p>=100){p=100;clearInterval(iv);setTimeout(()=>setScreen("welcome"),380);}
      setLoadPct(Math.min(100,p));
    },110);
    return()=>clearInterval(iv);
  },[screen]);

  /* ── PWA ── */
  useEffect(()=>{
    window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installRef.current=e;setCanInstall(true);});
    window.addEventListener("appinstalled",()=>setCanInstall(false));
  },[]);

  /* ── Voice ── */
  const speak=useCallback(text=>{
    if(!voice)return;
    const s=window.speechSynthesis; if(!s)return;
    const go=()=>{
      s.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=1.0;u.pitch=1.0;u.volume=1;
      const vs=s.getVoices();
      const pref=vs.find(v=>["Samantha","Karen","Moira","Victoria","Tessa","Google UK English Female"].some(n=>v.name.includes(n)))
        ||vs.find(v=>v.lang.startsWith("en")&&!v.name.toLowerCase().includes("male"))||vs[0];
      if(pref)u.voice=pref; s.speak(u);
    };
    s.getVoices().length>0?go():(s.onvoiceschanged=go);
  },[voice]);

  /* ── Save / Load ── */
  const saveG=()=>{try{localStorage.setItem("sfv3",JSON.stringify({round,totalRnds,couples:couplesRef.current,usedIds,points,flameE:flameRef.current,archetype,recentCats,recentTypes,chaosLeft,branchDepth,fateTurn,fateIdx:fateIdxRef.current}));}catch{}};
  const loadG=()=>{try{const x=localStorage.getItem("sfv3");return x?JSON.parse(x):null;}catch{return null;}};
  const clearG=()=>{try{localStorage.removeItem("sfv3");}catch{}};

  /* ── Timer ── */
  const startTimer=s=>{
    clearInterval(timerRef.current);
    setTimeLeft(s);setTimerOn(true);
    timerRef.current=setInterval(()=>{
      setTimeLeft(p=>{if(p<=1){clearInterval(timerRef.current);setTimerOn(false);speak("Time is up!");return 0;}return p-1;});
    },1000);
  };

  /* ── Flame Energy ── */
  const addFlame=(n)=>{
    setFlameE(e=>{const nv=Math.min(100,Math.max(0,e+n));flameRef.current=nv;return nv;});
  };

  /* ── Player management ── */
  const addPlayer=()=>{
    if(!newName.trim()||players.length>=12)return;
    setPlayers(p=>[...p,{id:Date.now(),name:newName.trim(),gender:newGender,partner:null}]);
    setNewName("");
  };
  const removePlayer=id=>setPlayers(p=>p.filter(x=>x.id!==id).map(x=>x.partner===id?{...x,partner:null}:x));
  const linkPlayers=pid=>{
    if(!linkStep){setLinkStep(pid);return;}
    if(linkStep===pid){setLinkStep(null);return;}
    setPlayers(prev=>{
      const a=prev.find(p=>p.id===linkStep),b=prev.find(p=>p.id===pid);
      return prev.map(p=>{
        if(p.id===a?.partner&&p.id!==pid)return{...p,partner:null};
        if(p.id===b?.partner&&p.id!==linkStep)return{...p,partner:null};
        if(p.id===linkStep)return{...p,partner:pid};
        if(p.id===pid)return{...p,partner:linkStep};
        return p;
      });
    });
    setLinkStep(null);
  };
  const getCouples=()=>{
    const seen=new Set(),list=[];
    players.forEach(p=>{
      if(p.partner&&!seen.has(p.id)){
        const pt=players.find(x=>x.id===p.partner);
        if(pt){list.push([p,pt]);seen.add(p.id);seen.add(pt.id);}
      }
    });
    return list;
  };

  /* ── Draw a card from the adaptive engine ── */
  const drawCard=(rNum,cl,ids,cats,types,energy,depth,chaosEff,timerOverride)=>{
    setCardAnim(false);
    clearInterval(timerRef.current);setTimerOn(false);

  /* ── Start a round (master function) ── */
  const startRound=(rNum,cl,ids,cats,types,energy,depth,chaosRmn,chaosEff)=>{
    const type=ENGINE.selectRoundType(rNum,energy,types,chaosRmn);

    if(type==="spin"||types[types.length-1]==="spin"){
      setRoundType("spin");setCard(null);setSpinRes(null);setSpinning(false);
      const nt=[...types,"spin"].slice(-6);setRecentTypes(nt);
      speak("Spin the Bottle! Let fate decide your next move.");
      return;
    }
    if(type==="fate"){
      const fc=fateDeckRef.current[fateIdxRef.current%FATE.length];
      fateIdxRef.current+=1;
      setRoundType("fate");setCard(null);setFateCard(fc);setFateFlip(false);
      setFateTurn(t=>(t+1)%2);
      const nt=[...types,"fate"].slice(-6);setRecentTypes(nt);
      speak("Cards of Fate! Draw your card and discover what awaits.");
      return;
    }
    if(type==="puzzle"){
      // find a puzzle card
      const pCards=CARDS.filter(c=>c.cat==="puzzle"&&!ids.includes(c.id));
      if(pCards.length){
        const raw=pCards[Math.floor(Math.random()*pCards.length)];
        setRoundType("card");
        const couple=cl[0]||[];
        const p1=couple[0]||{name:"Partner 1",gender:"female"};
        const p2=couple[1]||{name:"Partner 2",gender:"male"};
        const c={...raw,inst:inj(raw.inst,p1,p2),fu:inj(raw.fu,p1,p2),couple:`${p1.name} & ${p2.name}`};
        const nu=[...ids,raw.id],nc=[...cats,"puzzle"].slice(-6),nt=[...types,"puzzle"].slice(-6);
        setCard(c);setUsedIds(nu);setRecentCats(nc);setRecentTypes(nt);
        if(raw.pid)setPuzData(PUZZLES[raw.pid]);
        setTimeout(()=>{setCardAnim(true);speak(c.inst);},160);
        return;
      }
    }
    if(type==="chaos"){
      const ev=pick(CHAOS);
      setChaosEv(ev);setChaosLeft(ev.rounds);setChaosEffect(ev.effect);
      setShowChaos(true);
      speak(`${ev.name} ${ev.desc}`);
      // After chaos reveal, draw a card
      setTimeout(()=>{
        setShowChaos(false);
        setRoundType("card");
        const timerOvr=ev.effect==="speed"?20:undefined;
        const depth2=ev.effect==="intensify"?2:0;
        drawCard(rNum,cl,ids,cats,types,energy,depth2,ev.effect,timerOvr);
      },3200);
      return;
    }
    // Regular card
    setRoundType("card");
    const timerOvr=chaosEff==="speed"?20:undefined;
    drawCard(rNum,cl,ids,cats,types,energy,depth,chaosEff,timerOvr);
  };

  /* ── Advance to next round ── */
  const goNext=()=>{
    clearInterval(timerRef.current);
    setShowBranch(false);
    const nr=round+1;
    if(nr>=totalRnds){
      clearG();setScreen("finale");
      speak("Congratulations! SoulFlare is complete. May your love burn brighter every single day.");
      return;
    }
    // Energy-based chaos check
    if(ENGINE.shouldChaos(nr,recentCats,chaosLeft)){
      const ev=pick(CHAOS);
      setChaosEv(ev);setChaosLeft(ev.rounds);setChaosEffect(ev.effect);
      setShowChaos(true);
      speak(`${ev.name} ${ev.desc}`);
      setTimeout(()=>{
        setShowChaos(false);
        setRound(nr);
        const timerOvr=ev.effect==="speed"?20:undefined;
        const nextDepth=ev.effect==="intensify"?branchDepth+1:branchDepth;
        setRoundType("card");
        const res=drawCard(nr,couplesRef.current,usedIds,recentCats,recentTypes,flameRef.current,nextDepth,ev.effect,timerOvr);
      },3200);
    } else {
      const newChaosLeft=Math.max(0,chaosLeft-1);
      const eff=newChaosLeft>0?chaosEffect:null;
      if(newChaosLeft===0)setChaosEffect(null);
      setChaosLeft(newChaosLeft);
      setRound(nr);
      startRound(nr,couplesRef.current,usedIds,recentCats,recentTypes,flameRef.current,branchDepth,newChaosLeft,eff);
    }
  };

  const handleCardComplete=()=>{
    // Add energy for completing card
    if(card){addFlame(card.energyGain||6);}
    // Check for spicy content & age gate
    if(card?.cat==="spicy"&&!ageWarned){setAgeWarned(true);return;}
    // Check for branch
    if(ENGINE.shouldBranch(card,round)){setShowBranch(true);}
    else{goNext();}
  };

  const chooseBranch=(depth)=>{
    setBranchDepth(depth);
    const energyBoost=depth>0?10:depth===0?5:2;

    goNext();
  };

  /* ── Begin / Resume ── */
  const beginNew=cl=>{

    setTotalRnds(tr);setUsedIds([]);setCard(null);setPoints(0);
    setRecentCats([]);setRecentTypes([]);setChaosLeft(0);setChaosEffect(null);
    setBranchDepth(0);setFateTurn(0);setAgeWarned(false);

    setScreen("game");
    speak(`Welcome to SoulFlare. ${cl[0][0].name} and ${cl[0][1].name}, your journey begins now.`);

    clearInterval(contRef.current);setContPrompt(false);

    setFlameE(sv.flameE||50);flameRef.current=sv.flameE||50;
    setArchetype(sv.archetype);setRecentCats(sv.recentCats||[]);
    setRecentTypes(sv.recentTypes||[]);setChaosLeft(sv.chaosLeft||0);
    setBranchDepth(sv.branchDepth||0);setFateTurn(sv.fateTurn||0);
    const m=pick(MISSIONS);setMission(m);
    setScreen("game");speak(`Welcome back. Continuing from round ${sv.round+1}.`);
    startRound(sv.round,sv.couples,sv.usedIds||[],sv.recentCats||[],sv.recentTypes||[],sv.flameE||50,sv.branchDepth||0,sv.chaosLeft||0,null);
  };

  const handleIgnite=()=>{
    const c=getCouples();if(!c.length){alert("Link at least one couple first!");return;}

    const sv=loadG();

      contRef.current=setInterval(()=>setContCount(p=>{

  const handleInstall=async()=>{
    if(!installRef.current)return;
    installRef.current.prompt();

  };

  /* ── Spin ── */
  const handleSpin=()=>{
    if(spinning)return;
    setSpinning(true);setSpinRes(null);
    const extra=1080+Math.floor(Math.random()*720),na=spinAngle+extra;
    setSpinAngle(na);
    setTimeout(()=>{

  /* ── Zone color for energy ── */
  const zi=zoneInfo(flameE);
  const energyColor=flameE<=30?"#64b5f6":flameE<=55?"#e879a0":flameE<=78?"#ff6b35":"#ff4500";
  const energyBg=flameE<=30?"linear-gradient(90deg,#1565c0,#42a5f5)":
                 flameE<=55?"linear-gradient(90deg,#e8175d,#e879a0)":
                 flameE<=78?"linear-gradient(90deg,#ff6b35,#d4a853)":
                 "linear-gradient(90deg,#ff4500,#ff6b35,#ffd700)";

  /* ── Shared UI ── */
  const root={minHeight:"100vh",minHeight:"100dvh",
    background:"linear-gradient(150deg,#06020e 0%,#0e0519 50%,#06020f 100%)",
    fontFamily:"'Cormorant Garamond','Georgia',serif",color:"#f5e6d3",

  const Sparks=()=>(
    <div style={{position:"absolute",inset:0,overflow:"hidden",pointerEvents:"none",zIndex:0}}>

  /* ══════════════════════════════════════

     ══════════════════════════════════════ */

        </p>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",marginBottom:18}}>
          {[["❤️‍🔥","Adaptive"],["⚡","Chaos Events"],["🌶️","Branching"],["🧩","Puzzles"],["🍾","Spin"],["🃏","Fate"],["🎯","Missions"]].map(([e,l])=>(

  /* ══════════════════════════════════════
     SETUP + ARCHETYPE

  if(screen==="setup"){

                  <div style={{fontSize:11,color:"#6a5a7a",lineHeight:1.4}}>{a.desc}</div>

              <p style={{color:"#d4a853",fontWeight:600,marginBottom:4,fontSize:13}}>💑 {cpls.length} couple{cpls.length>1?"s":""} ready</p>
              {cpls.map((c,i)=><p key={i} style={{color:"#a090b8",fontSize:13}}>{c[0].name} ♥ {c[1].name}</p>)}

            {!cpls.length?"Link a couple first":!archetype?"Choose your archetype":"🔥 Ignite SoulFlare"}

                {sv&&<p style={{color:"#d4a853",fontSize:12,fontStyle:"italic",marginBottom:10}}>Round {(sv.round||0)+1} · 💎{sv.points||0}pts · 🔥{sv.flameE||50} energy</p>}
                <div style={{position:"relative",width:64,height:64,margin:"0 auto 8px"}}>

                    <circle cx="32" cy="32" r="28" fill="none" stroke="#e8175d" strokeWidth="4"

  /* ══════════════════════════════════════
     GAME SCREEN
     ══════════════════════════════════════ */
  if(screen==="game"){
    const couple=couplesRef.current[0]||[];
    const p1=couple[0]||{name:"Partner 1",gender:"female"};
    const p2=couple[1]||{name:"Partner 2",gender:"male"};
    const prog=round/totalRnds*100;
    const isSpinR=roundType==="spin",isFateR=roundType==="fate";
    const canGo=(!isSpinR||!!spinRes)&&(!isFateR||fateFlip);
    const nextLabel=isSpinR&&!spinRes?"🍾 Spin First!":isFateR&&!fateFlip?"🃏 Draw Your Card!":round+1>=totalRnds?"🎊 Complete!":"Next →";
    const fateTc={question:"#e8175d",activity:"#d4a853",quiz:"#9c27b0",dare:"#ff4500"};
    const female=couple.find?.(x=>x.gender==="female")||p1;
    const male=couple.find?.(x=>x.gender==="male")||p2;
    const SZ=238,CX=119,CY=119,R=104;
    const ZC=["#e8175d","#c2185b","#d4a853","#ff6b35","#9c27b0","#3f51b5","#00897b","#43a047","#fb8c00","#e91e63","#0288d1","#6d4c41"];
    const arcInfo=ARCHETYPES.find(a=>a.id===archetype)||ARCHETYPES[0];

    const actionBtn=(label,onClick,disabled,style={})=>(
      <button className="sfb" onClick={onClick} disabled={disabled}
        style={{width:"100%",padding:15,borderRadius:12,fontSize:16,fontFamily:"'Playfair Display',serif",fontWeight:700,
          background:disabled?"#1a1030":`linear-gradient(135deg,${energyColor},${energyColor}88)`,
          color:disabled?"#4a3a5a":"#fff",boxShadow:disabled?"none":`0 0 22px ${energyColor}44`,
          transition:"all .3s",...style}}>
        {label}</button>
    );

    return(
      <div style={{...root,justifyContent:"flex-start"}}><Sparks/>
        <div style={{width:"100%",maxWidth:480,minHeight:"100dvh",display:"flex",flexDirection:"column",position:"relative",zIndex:1,padding:"10px 12px"}}>

          {/* ── HEADER ── */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:5}}>
              <button className="sfb" onClick={()=>{clearInterval(timerRef.current);window.speechSynthesis?.cancel();setCard(null);setScreen("welcome");}}
                style={{background:"#110820",border:"1px solid #1e1030",borderRadius:7,padding:"4px 8px",color:"#6a5a7a",fontSize:11}}>🏠</button>
              <div style={{background:`${energyColor}18`,border:`1px solid ${energyColor}44`,borderRadius:20,
                padding:"3px 9px",color:energyColor,fontSize:11,fontWeight:700}}>
                {zi.emoji} {zi.label}</div>
              {chaosLeft>0&&chaosEv&&(
                <div style={{background:`${chaosEv.color}18`,border:`1px solid ${chaosEv.color}44`,
                  borderRadius:20,padding:"3px 8px",color:chaosEv.color,fontSize:11,fontWeight:700,animation:"pulse .8s ease-in-out infinite"}}>
                  {chaosEv.emoji} ×{chaosLeft}</div>
              )}
            </div>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              {points>0&&<div style={{background:"#d4a85318",border:"1px solid #d4a85344",borderRadius:20,padding:"3px 8px",color:"#d4a853",fontSize:11,fontWeight:700}}>💎{points}</div>}
              <button className="sfb" onClick={()=>{setVoice(v=>!v);window.speechSynthesis?.cancel();}}
                style={{background:voice?"#e8175d18":"#1a1030",border:`1px solid ${voice?"#e8175d44":"#1e1030"}`,
                  borderRadius:7,padding:"4px 7px",color:voice?"#e8175d":"#4a3a5a",fontSize:13}}>{voice?"🔊":"🔇"}</button>
              <span style={{color:"#5a4a6a",fontSize:11}}>Rnd {round+1}</span>
            </div>
          </div>

          {/* ── FLAME ENERGY METER ── */}
          <div style={{marginBottom:9}}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
              <span style={{fontSize:13,animation:flameE>75?"flameDance 0.8s ease-in-out infinite":"none"}}>
                {flameE>75?"🔥":flameE>50?"🌶️":flameE>25?"✨":"🌱"}
              </span>
              <div style={{flex:1,height:6,background:"#1a1030",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${flameE}%`,background:energyBg,borderRadius:4,transition:"width .8s ease"}}/>
              </div>
              <span style={{fontSize:10,color:energyColor,fontWeight:700,minWidth:28}}>{flameE}</span>
            </div>
            <div style={{height:2,background:"#1a1030",borderRadius:2,overflow:"hidden"}}>
              <div style={{width:`${prog}%`,height:"100%",background:energyBg,opacity:.5,transition:"width .5s ease"}}/>
            </div>
          </div>

          {/* ── ROUND CONTENT ── */}
          <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",gap:8}}>

            {/* ═══ SPIN ROUND ═══ */}
            {isSpinR&&(
              <div style={{animation:"slideUp .5s ease"}}>
                <div style={{textAlign:"center",marginBottom:9}}>
                  <span style={{fontSize:40}}>🍾</span>
                  <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#e8175d",marginTop:3,marginBottom:3}}>Spin the Bottle!</h3>
                  <div style={{display:"flex",justifyContent:"center",gap:14}}>
                    <span style={{color:"#e879a0",fontSize:11,fontWeight:700}}>♀ Top · {female.name}</span>
                    <span style={{color:"#8899e8",fontSize:11,fontWeight:700}}>♂ Bottom · {male.name}</span>
                  </div>
                </div>
                <div style={{position:"relative",width:SZ,height:SZ,margin:"0 auto 10px"}}>
                  <svg width={SZ} height={SZ} viewBox={`0 0 ${SZ} ${SZ}`} style={{position:"absolute",inset:0}}>
                    {Array.from({length:12},(_,i)=>{
                      const sa=(i*30-90)*Math.PI/180,ea=((i+1)*30-90)*Math.PI/180;
                      const x1=CX+R*Math.cos(sa),y1=CY+R*Math.sin(sa),x2=CX+R*Math.cos(ea),y2=CY+R*Math.sin(ea);
                      const mx=CX+(R*.63)*Math.cos((sa+ea)/2),my=CY+(R*.63)*Math.sin((sa+ea)/2);
                      const hi=spinRes&&(i===spinRes.top||i===spinRes.bot);
                      return(<g key={i}>
                        <path d={`M${CX} ${CY} L${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} Z`}
                          fill={hi?"#fff":ZC[i]} opacity={hi?1:.78} stroke="#06020e" strokeWidth="1.5"/>
                        <text x={mx} y={my} textAnchor="middle" dominantBaseline="middle" fontSize="9" fill={hi?"#06020e":"#fff"}
                          fontWeight="700" style={{fontFamily:"Arial,sans-serif",userSelect:"none"}}>{i+1}</text>
                      </g>);
                    })}
                    <circle cx={CX} cy={CY} r={15} fill="#09051a" stroke="#d4a853" strokeWidth="2"/>
                  </svg>
                  <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
                    <div style={{width:8,height:SZ*.84,transform:`rotate(${spinAngle}deg)`,
                      transition:spinning?"transform 3.8s cubic-bezier(0.17,0.67,0.08,0.99)":"none",
                      transformOrigin:"50% 50%",display:"flex",flexDirection:"column",borderRadius:4}}>
                      <div style={{flex:1,background:"linear-gradient(to bottom,#f48fb1,#e8175d)",borderRadius:"4px 4px 0 0"}}/>
                      <div style={{flex:1,background:"linear-gradient(to bottom,#5c6bc0,#1a237e)",borderRadius:"0 0 4px 4px"}}/>
                    </div>
                    <div style={{position:"absolute",width:13,height:13,borderRadius:"50%",background:"#d4a853",border:"2px solid #06020e"}}/>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"3px 7px",background:"#09051a",borderRadius:9,padding:"7px 9px",marginBottom:9}}>
                  {ZONES.map((z,i)=>{const hi=spinRes&&(i===spinRes.top||i===spinRes.bot);return(
                    <div key={i} style={{display:"flex",alignItems:"center",gap:3,opacity:hi?1:.35}}>
                      <div style={{width:14,height:14,borderRadius:"50%",background:ZC[i],flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <span style={{fontSize:7,color:"#fff",fontWeight:"700"}}>{i+1}</span>
                      </div>
                      <span style={{fontSize:9,color:hi?"#f5e6d3":"#5a4a6a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{z.n}</span>
                    </div>);
                  })}
                </div>
                {!spinRes&&(<button className="sfb" onClick={handleSpin} disabled={spinning}
                  style={{width:"100%",padding:13,background:spinning?"#1a1030":"linear-gradient(135deg,#e8175d,#a8083e)",
                    borderRadius:11,color:spinning?"#4a3a5a":"#fff",fontSize:16,fontFamily:"'Playfair Display',serif",
                    fontWeight:700,marginBottom:8,boxShadow:spinning?"none":"0 0 20px #e8175d44"}}>
                  {spinning?"Spinning…":"🍾 Tap to Spin!"}</button>)}
                {spinRes&&!spinning&&(
                  <div style={{animation:"pop .4s ease"}}>
                    <div style={{background:"#e879a014",border:"1px solid #e879a033",borderRadius:10,padding:"9px 12px",marginBottom:7}}>
                      <p style={{color:"#e879a0",fontSize:10,fontWeight:700,marginBottom:3}}>♀ {female.name} — Zone {spinRes.top+1}: {ZONES[spinRes.top].n}</p>
                      <p style={{color:"#d0bce8",fontSize:13,lineHeight:1.65}}>{ZONES[spinRes.top].f}</p>
                    </div>
                    <div style={{background:"#3f51b514",border:"1px solid #5c6bc033",borderRadius:10,padding:"9px 12px"}}>
                      <p style={{color:"#8899e8",fontSize:10,fontWeight:700,marginBottom:3}}>♂ {male.name} — Zone {spinRes.bot+1}: {ZONES[spinRes.bot].n}</p>
                      <p style={{color:"#d0bce8",fontSize:13,lineHeight:1.65}}>{ZONES[spinRes.bot].m}</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ═══ FATE ROUND ═══ */}
            {isFateR&&(
              <div style={{animation:"slideUp .5s ease"}}>
                <div style={{textAlign:"center",marginBottom:11}}>
                  <span style={{fontSize:40}}>🃏</span>
                  <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#d4a853",marginTop:3,marginBottom:3}}>Cards of Fate</h3>
                  <p style={{color:fateTurn%2===0?"#e8175d":"#d4a853",fontSize:13,fontWeight:700}}>
                    {fateTurn%2===0?p1.name:p2.name}'s turn to draw 🃏</p>
                </div>
                {!fateFlip?(
                  <div onClick={()=>setFateFlip(true)} style={{cursor:"pointer",
                    background:"linear-gradient(148deg,#1a0a38,#0c0520)",border:"2px solid #d4a85344",
                    borderRadius:18,padding:26,textAlign:"center",animation:"goldGlow 2.8s ease-in-out infinite"}}>
                    <div style={{fontSize:52,marginBottom:8}}>🃏</div>
                    <p style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#d4a853",fontWeight:900,letterSpacing:".06em",marginBottom:5}}>FATE</p>
                    <p style={{color:"#5a4a6a",fontSize:12}}>Tap to reveal your fate</p>
                  </div>
                ):(fateCard&&(
                  <div style={{background:"linear-gradient(148deg,#150b28,#0e0620)",
                    border:`2px solid ${fateTc[fateCard.type]||"#d4a853"}44`,
                    borderRadius:18,padding:16,animation:"flipCard .5s ease",
                    boxShadow:`0 0 40px ${fateTc[fateCard.type]||"#d4a853"}18`}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                      <span style={{background:`${fateTc[fateCard.type]||"#d4a853"}18`,
                        border:`1px solid ${fateTc[fateCard.type]||"#d4a853"}44`,
                        color:fateTc[fateCard.type]||"#d4a853",
                        padding:"3px 11px",borderRadius:20,fontSize:11,textTransform:"uppercase",fontWeight:700,letterSpacing:".1em"}}>
                        {fateCard.type}</span>
                      <span style={{fontSize:34}}>{fateCard.emoji}</span>
                    </div>
                    <h4 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#f5e6d3",marginBottom:10,lineHeight:1.2}}>{fateCard.title}</h4>
                    <p style={{fontSize:14,lineHeight:1.82,color:"#d0bce8"}}>{fateCard.body}</p>
                  </div>
                ))}
              </div>
            )}

            {/* ═══ REGULAR / PUZZLE / ACTIVITY CARD ═══ */}
            {!isSpinR&&!isFateR&&(card?(
              <div style={{
                background:card.cat==="activity"?"linear-gradient(148deg,#1a1028,#0e0818)":
                           card.cat==="spicy"?"linear-gradient(148deg,#220a12,#0e0618)":
                           card.rarity==="legendary"?"linear-gradient(148deg,#1a1200,#0e0800)":
                           "linear-gradient(148deg,#150b24,#0e0618)",
                border:`1px solid ${card.rarity==="legendary"?"#d4a85366":energyColor+"44"}`,
                borderRadius:18,padding:17,
                boxShadow:card.rarity==="legendary"
                  ?`0 0 60px #d4a85322,inset 0 1px 0 #d4a85322,animation:goldGlow 2s infinite`
                  :`0 0 40px ${energyColor}18,inset 0 1px 0 ${energyColor}1a`,
                animation:cardAnim?"reveal .6s ease":"none"}}>

                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:9}}>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{background:`${energyColor}20`,border:`1px solid ${energyColor}44`,color:energyColor,
                      padding:"3px 9px",borderRadius:20,fontSize:10,textTransform:"uppercase",letterSpacing:".1em",fontWeight:700}}>
                      {card.cat==="activity"?"🏃 CHALLENGE":card.rarity==="legendary"?"✨ LEGENDARY":card.rarity==="epic"?"⚡ EPIC":card.rarity==="rare"?"💎 RARE":`${card.cat}`}
                    </span>
                    {card.rarity==="legendary"&&<span style={{fontSize:11,color:"#d4a853",animation:"flicker 1.2s infinite"}}>RARE DROP</span>}
                  </div>
                  <div style={{display:"flex",gap:2}}>
                    {Array.from({length:Math.min(10,card.hot)}).map((_,i)=>(
                      <div key={i} style={{width:4,height:12,borderRadius:2,
                        background:i<card.hot?energyColor:"#1a1030"}}/>
                    ))}
                  </div>
                </div>

                <div style={{background:"#09051a",borderRadius:8,padding:"5px 10px",marginBottom:9,border:"1px solid #1a0e28"}}>
                  <p style={{color:"#d4a853",fontSize:12,fontWeight:600}}>🎯 {card.couple||"All Couples"}</p>
                </div>

                <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#f5e6d3",marginBottom:8,lineHeight:1.3}}>{card.title}</h3>

                {/* Puzzle UI */}
                {puzData&&!puzDone?(
                  <div style={{marginBottom:8}}>
                    <p style={{fontSize:13,color:"#c4b0d8",marginBottom:7,lineHeight:1.6}}>{puzData.q}</p>
                    {puzDouble&&<p style={{color:"#ffd700",fontSize:11,fontWeight:700,marginBottom:6,animation:"pulse .7s ease-in-out infinite"}}>🎯 DOUBLE DOWN — {puzData.pts*2} pts or -8 pts!</p>}
                    <div style={{background:"#09051a",border:"1px solid #d4a85333",borderRadius:10,padding:"10px 12px",marginBottom:8,textAlign:"center"}}>
                      <p style={{fontSize:16,color:"#d4a853",fontFamily:"'Playfair Display',serif",letterSpacing:".1em",lineHeight:1.6}}>{puzData.clue}</p>
                    </div>
                    {puzSel===null?(
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                        {puzData.opts.map((opt,i)=>(
                          <button key={i} className="sfb" onClick={()=>{
                            const ok=opt===puzData.ans; setPuzSel(i);
                            if(ok){const np=points+(puzDouble?puzData.pts*2:puzData.pts);setPoints(np);addFlame(14);}
                            else if(puzDouble){setPoints(p=>Math.max(0,p-8));addFlame(-5);}
                            setTimeout(()=>setPuzDone(true),1100);
                          }} style={{padding:"8px 6px",background:"#110820",border:"1px solid #1e1030",borderRadius:9,color:"#c4b0d8",fontSize:13}}>
                            {opt}</button>
                        ))}
                      </div>
                    ):(
                      <div style={{padding:11,borderRadius:9,
                        background:puzData.opts[puzSel]===puzData.ans?"#00880020":"#e8175d18",
                        border:`1px solid ${puzData.opts[puzSel]===puzData.ans?"#00880044":"#e8175d44"}`,textAlign:"center"}}>
                        <p style={{fontSize:13,fontWeight:700,color:puzData.opts[puzSel]===puzData.ans?"#4caf50":"#e8175d"}}>
                          {puzData.opts[puzSel]===puzData.ans?`✓ Correct! +${puzDouble?puzData.pts*2:puzData.pts} pts`:`✗ Answer: ${puzData.ans}${puzDouble?" (-8 pts)":""}`}
                        </p>
                      </div>
                    )}
                  </div>
                ):(
                  <p style={{fontSize:15,lineHeight:1.85,color:"#d0bce8",marginBottom:9}}>{card.inst}</p>
                )}

                {/* Timer */}
                {timerOn&&(
                  <div style={{background:"#09051a",borderRadius:10,padding:8,textAlign:"center",marginBottom:8,
                    border:`1px solid ${timeLeft<10?"#e8175d":"#1a0e28"}`}}>
                    <div style={{fontSize:32,fontFamily:"'Playfair Display',serif",
                      color:timeLeft<10?"#e8175d":"#d4a853",animation:timeLeft<10?"pulse .5s ease-in-out infinite":"none"}}>
                      {Math.floor(timeLeft/60).toString().padStart(2,"0")}:{(timeLeft%60).toString().padStart(2,"0")}
                    </div>
                  </div>
                )}

                {card.fu&&(!puzData||puzDone)&&(
                  <><HR/><p style={{fontSize:13,color:"#7a6a8a",fontStyle:"italic",lineHeight:1.7,marginTop:7}}>✨ {card.fu}</p></>
                )}
              </div>
            ):(
              <div style={{textAlign:"center",padding:"36px 0"}}>
                <div style={{width:36,height:36,border:`3px solid ${energyColor}33`,borderTop:`3px solid ${energyColor}`,
                  borderRadius:"50%",animation:"spin360 1s linear infinite",margin:"0 auto 10px"}}/>
                <p style={{color:"#5a4a6a",fontStyle:"italic",fontSize:13}}>The flame is choosing…</p>
              </div>
            ))}
          </div>

          {/* ── FOOTER ── */}
          <div style={{paddingTop:10,paddingBottom:4}}>
            {actionBtn(nextLabel,handleCardComplete,!canGo,{marginBottom:6})}
            {card&&voice&&!isSpinR&&!isFateR&&(
              <button className="sfb" onClick={()=>speak(card.inst)} style={{width:"100%",padding:8,background:"#110820",border:"1px solid #1e1030",borderRadius:9,color:"#7a6a8a",fontSize:12}}>🔊 Replay</button>
            )}
          </div>
        </div>

        {/* ═══ CHAOS EVENT OVERLAY ═══ */}
        {showChaos&&chaosEv&&(
          <div style={{position:"fixed",inset:0,background:"rgba(6,2,14,.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}}>
            <div style={{background:`linear-gradient(148deg,${chaosEv.color}18,#110820)`,
              border:`2px solid ${chaosEv.color}66`,borderRadius:22,padding:"24px 20px",
              maxWidth:360,width:"100%",textAlign:"center",animation:"chaosIn .5s cubic-bezier(0.34,1.56,0.64,1)"}}>
              <div style={{fontSize:64,marginBottom:8,animation:"hb 1.2s ease-in-out infinite"}}>{chaosEv.emoji}</div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:26,color:chaosEv.color,marginBottom:4,letterSpacing:".04em"}}>{chaosEv.name}</h2>
              <p style={{color:chaosEv.color,fontSize:13,fontStyle:"italic",marginBottom:14}}>{chaosEv.sub}</p>
              <HR c={chaosEv.color}/>
              <p style={{color:"#d0bce8",fontSize:15,lineHeight:1.78,marginTop:10}}>{chaosEv.desc}</p>
              <p style={{color:"#5a4a6a",fontSize:12,marginTop:16,animation:"flicker 1.2s infinite"}}>Activating in a moment…</p>
            </div>
          </div>
        )}

        {/* ═══ BRANCH CHOICE OVERLAY ═══ */}
        {showBranch&&(
          <div style={{position:"fixed",inset:0,background:"rgba(6,2,14,.9)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:200,padding:"0 14px 20px"}}>
            <div style={{background:"#110820",border:"1px solid #e8175d33",borderRadius:20,padding:"20px 16px",
              maxWidth:460,width:"100%",animation:"branchIn .4s cubic-bezier(0.34,1.56,0.64,1)"}}>
              <p style={{color:"#e8175d",fontSize:12,fontWeight:700,textAlign:"center",letterSpacing:".12em",marginBottom:4}}>🔱 A MOMENT OF CHOICE</p>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:20,color:"#f5e6d3",textAlign:"center",marginBottom:16}}>How do you want to continue?</h3>
              <div style={{display:"flex",gap:8}}>
                {[
                  {label:"🔥 Go Deeper",desc:"We want more intensity",depth:1,color:"#ff4500"},
                  {label:"💙 Stay Here",desc:"This pace feels right",depth:0,color:"#e8175d"},
                  {label:"🌊 Breathe",desc:"We need a gentle moment",depth:-1,color:"#42a5f5"},
                ].map(b=>(
                  <button key={b.depth} className="sfb" onClick={()=>chooseBranch(b.depth)} style={{flex:1,
                    padding:"11px 6px",textAlign:"center",background:`${b.color}14`,
                    border:`1px solid ${b.color}44`,borderRadius:12,color:b.color}}>
                    <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>{b.label}</div>
                    <div style={{fontSize:10,color:"#8a7a9a"}}>{b.desc}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* ═══ AGE GATE ═══ */}
        {ageWarned&&(
          <div style={{position:"fixed",inset:0,background:"rgba(6,2,14,.96)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}>
            <div style={{background:"#110820",border:"1px solid #ff450055",borderRadius:18,padding:22,maxWidth:340,textAlign:"center",animation:"rise .5s ease"}}>
              <div style={{fontSize:52,marginBottom:8}}>🔥</div>
              <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:22,color:"#ff4500",marginBottom:8}}>Adult Content Ahead</h3>
              <p style={{color:"#c4b0d8",fontSize:13,lineHeight:1.78,marginBottom:14}}>This card contains 18+ content. All players confirm they are adults.</p>
              <HR c="#ff4500"/>
              <div style={{display:"flex",gap:8,marginTop:12}}>
                <button className="sfb" onClick={()=>{setAgeWarned(false);goNext();}} style={{flex:1,padding:11,background:"#1a1030",border:"1px solid #1e1030",borderRadius:10,color:"#6a5a7a",fontSize:13,fontFamily:"'Playfair Display',serif"}}>Skip</button>
                <button className="sfb" onClick={confirmAge} style={{flex:1,padding:11,background:"linear-gradient(135deg,#ff4500,#c2185b)",borderRadius:10,color:"#fff",fontSize:13,fontFamily:"'Playfair Display',serif",fontWeight:700}}>We're Adults 🔥</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ══════════════════════════════════════
     FINALE
     ══════════════════════════════════════ */
  if(screen==="finale") return(
    <div style={root}><Sparks/>
      <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at center,${energyColor}12 0%,transparent 68%)`,pointerEvents:"none"}}/>
      <div style={{textAlign:"center",zIndex:1,maxWidth:400,padding:"20px 16px",overflowY:"auto",maxHeight:"100dvh",animation:"rise .8s ease"}}>
        <div style={{fontSize:68,animation:"heartbeat 1.6s ease-in-out infinite",marginBottom:10}}>❤️‍🔥</div>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:"clamp(28px,9vw,46px)",
          background:`linear-gradient(135deg,#e8175d,#d4a853)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:6}}>
          SoulFlare Complete!</h2>
        {couples.length>0&&<p style={{color:"#d4a853",fontSize:14,fontStyle:"italic",marginBottom:6}}>
          {couples.map(c=>`${c[0].name} & ${c[1].name}`).join(" · ")}</p>}
        <HR/>

        {/* Flame score */}
        <div style={{background:"#110820",border:`1px solid ${energyColor}33`,borderRadius:14,padding:14,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-around"}}>
            <div style={{textAlign:"center"}}>
              <p style={{color:"#5a4a6a",fontSize:11,marginBottom:2}}>FLAME ENERGY</p>
              <p style={{color:energyColor,fontSize:26,fontWeight:700,fontFamily:"'Playfair Display',serif"}}>{flameE}/100</p>
            </div>
            <div style={{width:1,background:"#1e1030"}}/>
            <div style={{textAlign:"center"}}>
              <p style={{color:"#5a4a6a",fontSize:11,marginBottom:2}}>POINTS</p>
              <p style={{color:"#d4a853",fontSize:26,fontWeight:700,fontFamily:"'Playfair Display',serif"}}>💎{points}</p>
            </div>
            <div style={{width:1,background:"#1e1030"}}/>
            <div style={{textAlign:"center"}}>
              <p style={{color:"#5a4a6a",fontSize:11,marginBottom:2}}>ROUNDS</p>
              <p style={{color:"#c4b0d8",fontSize:26,fontWeight:700,fontFamily:"'Playfair Display',serif"}}>{round}</p>
            </div>
          </div>
          {(points>=30||flameE>=80)&&(
            <div style={{marginTop:11,padding:"10px",background:"#e8175d14",border:"1px solid #e8175d44",borderRadius:10,animation:"pop .6s ease"}}>
              <p style={{color:"#e8175d",fontSize:16,fontWeight:700,fontFamily:"'Playfair Display',serif",marginBottom:2}}>🏆 SoulFlare Couple!</p>
              <p style={{color:"#c4b0d8",fontSize:12}}>You burned bright and went all the way. This title is yours.</p>
            </div>
          )}
        </div>

        {/* Secret Mission reveal */}
        {mission&&(
          <div style={{background:"#110820",border:"1px solid #d4a85333",borderRadius:14,padding:14,marginBottom:12}}>
            {!showMission?(
              <button className="sfb" onClick={()=>setShowMission(true)} style={{width:"100%",padding:11,
                background:"linear-gradient(135deg,#d4a853,#c49040)",borderRadius:10,
                color:"#06020e",fontSize:14,fontFamily:"'Playfair Display',serif",fontWeight:700}}>
                🔮 Reveal Your Secret Mission</button>
            ):(
              <div>
                <p style={{color:"#d4a853",fontSize:12,fontWeight:700,marginBottom:6,letterSpacing:".1em"}}>YOUR SECRET MISSION WAS:</p>
                <p style={{color:"#f5e6d3",fontSize:14,lineHeight:1.7,marginBottom:10}}>{mission.task}</p>
                <p style={{color:"#5a4a6a",fontSize:12,marginBottom:8}}>Did you complete it?</p>
                {!missionDone?(
                  <div style={{display:"flex",gap:7}}>
                    <button className="sfb" onClick={()=>{setMissionDone(true);}} style={{flex:1,padding:9,background:"#1a1030",border:"1px solid #1e1030",borderRadius:9,color:"#6a5a7a",fontSize:13}}>✗ Not quite</button>
                    <button className="sfb" onClick={()=>{setMissionDone(true);setPoints(p=>p+mission.pts);}} style={{flex:1,padding:9,background:"linear-gradient(135deg,#d4a853,#c49040)",borderRadius:9,color:"#06020e",fontSize:13,fontWeight:700}}>✓ Yes! +{mission.pts}pts</button>
                  </div>
                ):(
                  <p style={{color:"#4caf50",fontSize:13,fontWeight:700}}>✓ Mission recorded! Final score: 💎{points}</p>
                )}
              </div>
            )}
          </div>
        )}

        <div style={{background:"#110820",border:"1px solid #d4a85333",borderRadius:13,padding:"13px 16px",marginBottom:16}}>
          <p style={{color:"#d4a853",fontSize:15,fontStyle:"italic",lineHeight:1.7,marginBottom:5}}>
            "And now these three remain: faith, hope and love. But the greatest of these is love."</p>
          <p style={{color:"#5a4a6a",fontSize:11}}>— 1 Corinthians 13:13</p>
        </div>

        <div style={{display:"flex",gap:8}}>
          <button className="sfb" onClick={()=>{clearG();setCouples([]);couplesRef.current=[];setPlayers([]);
            setRound(0);setFlameE(50);setUsedIds([]);setCard(null);setPoints(0);setScreen("welcome");}}
            style={{flex:1,padding:12,background:"#110820",border:"1px solid #1e1030",borderRadius:11,color:"#8a7a9a",fontSize:14,fontFamily:"'Playfair Display',serif"}}>
            🏠 Menu</button>
          <button className="sfb" onClick={()=>{
            clearG();const cl=couplesRef.current;
            fateDeckRef.current=shuffle([...FATE]);fateIdxRef.current=0;
            const tr=22+Math.floor(Math.random()*8);
            setRound(0);setFlameE(50);flameRef.current=50;setTotalRnds(tr);setUsedIds([]);setPoints(0);
            setCard(null);setRecentCats([]);setRecentTypes([]);setChaosLeft(0);setChaosEffect(null);
            setBranchDepth(0);setFateTurn(0);setAgeWarned(false);setMissionDone(false);setShowMission(false);
            const m=pick(MISSIONS);setMission(m);
            setScreen("game");speak("Welcome back. The flame has been relit.");
            startRound(0,cl,[],[],[],50,0,0,null);
          }} style={{flex:1,padding:12,background:"linear-gradient(135deg,#e8175d,#a8083e)",borderRadius:11,color:"#fff",fontSize:14,fontFamily:"'Playfair Display',serif",fontWeight:700}}>
            Play Again 🔥</button>
        </div>
      </div>
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<SoulFlare/>);
</script>
<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(r=>{r.addEventListener('updatefound',()=>{const n=r.installing;n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)n.postMessage({type:'SKIP_WAITING'});});});})
      .catch(e=>console.warn('SW:',e));
  });
}
</script>
</body>
</html>
